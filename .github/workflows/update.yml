name: Update early vote data

on:
  schedule:
    # NCSBE posts the refreshed file each morning Eastern. Run at ~10:17 and
    # ~16:17 Eastern (14:17 and 20:17 UTC) to catch late postings.
    - cron: "17 14 * * *"
    - cron: "17 20 * * *"
  push:
    branches: [main]
    paths:
      - "pipeline/**"
      - "requirements.txt"
      - "pipeline/states/**"
      - "pipeline/national.json"
      - ".github/workflows/update.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild the 2018 and 2022 baselines too"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Early vote data (each state with a source)
        run: |
          mkdir -p docs/data/logs
          : > docs/data/logs/early_vote.log
          status=0
          for f in pipeline/states/*.json; do
            code=$(basename "$f" .json)
            echo "[$(date -u +%H:%M:%S)] $code" | tee -a docs/data/logs/early_vote.log
            python pipeline/build.py --state "$code" ${{ inputs.force && '--force' || '' }} 2>&1 | tee -a docs/data/logs/early_vote.log; [ "${PIPESTATUS[0]}" = 0 ] || status=1
            python pipeline/registration.py --state "$code" ${{ inputs.force && '--force' || '' }} 2>&1 | tee -a docs/data/logs/early_vote.log; [ "${PIPESTATUS[0]}" = 0 ] || status=1
          done
          exit $status

      - name: Polling averages (VoteHub)
        if: always()
        run: python pipeline/polls.py 2>&1 | tee docs/data/logs/polls.log

      - name: Projections
        if: always()
        run: python pipeline/project.py 2>&1 | tee docs/data/logs/projections.log

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          exec > >(tee /tmp/commit.log) 2>&1
          git status --short | head -50
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -q -m "Update early vote data $(date -u +%Y-%m-%d)"
          ok=0
          for i in 1 2 3; do
            if git pull --rebase --autostash -q origin main && git push origin HEAD:main; then ok=1; break; fi
            git status --short | head -20
            sleep 5
          done
          if [ "$ok" != 1 ]; then echo "PUSH FAILED"; exit 1; fi

      - name: Save diagnostics (on failure)
        if: failure()
        run: |
          cp docs/data/logs/*.log /tmp/ 2>/dev/null || true
          git fetch -q origin main
          git checkout -q --orphan status
          git rm -rfq . >/dev/null 2>&1 || true
          cp /tmp/*.log . 2>/dev/null || true
          git add *.log
          git commit -qm "diagnostics $(date -u +%FT%TZ)"
          git push -f origin status
