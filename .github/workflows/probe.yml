name: Probe data sources
on:
  push:
    branches: [main]
    paths: ["pipeline/probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: timeout 900 python pipeline/probe.py > /tmp/out.txt 2>&1 || true
      - name: Save output to probe branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe
          git rm -rfq .
          cp /tmp/out.txt probe_output.txt
          git add probe_output.txt
          git commit -qm "probe output"
          git push -f origin probe
