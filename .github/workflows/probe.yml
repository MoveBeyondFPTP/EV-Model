name: Probe data sources
on:
  push:
    branches: [main]
    paths: ["pipeline/probe.py"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python pipeline/probe.py
